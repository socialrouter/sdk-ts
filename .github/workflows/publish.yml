name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required for npm Trusted Publishing (OIDC) and provenance attestations.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # Trusted Publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      # Tests and typecheck both import the built `dist/`, so build first.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Builds, runs the offline suite, then the read-only contract suite
      # against the live API. Without SOCIALROUTER_API_KEY the authenticated
      # half is skipped; the catalogue half still runs.
      - name: Test
        run: npm test
        env:
          SOCIALROUTER_API_KEY: ${{ secrets.SOCIALROUTER_API_KEY }}

      - name: Publish
        run: npm publish --provenance --access public
        env:
          # `prepublishOnly` re-runs `npm test`; give it the same key.
          SOCIALROUTER_API_KEY: ${{ secrets.SOCIALROUTER_API_KEY }}

      # Tell the downstream packages a new SDK is on npm. Only after the publish
      # succeeded, so they never chase a version that failed to ship. Each one
      # bumps its @socialrouter/sdk range, tests, releases and publishes itself
      # (sdk-bump.yml). Skipped for a manual run that is not on a tag, and
      # guarded on the secret: a missing token must not fail a publish that
      # already went out.
      - name: Trigger mcp and cli
        if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::DOWNSTREAM_DISPATCH_TOKEN is not set — mcp and cli not notified."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          for repo in mcp cli; do
            gh api "repos/socialrouter/$repo/dispatches" \
              -f event_type=sdk-published \
              -f "client_payload[version]=$version"
          done

